services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventario_test
      POSTGRES_PASSWORD: inventario_test
      POSTGRES_DB: inventario_test
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U inventario_test -d inventario_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 20