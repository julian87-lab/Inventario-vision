name: inventario-deploy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.deploy}
      POSTGRES_DB: inventario
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - database
    logging: *logging

  api:
    image: inventario-vision-api:deploy
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: Inventario Vision API
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://inventario:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.deploy}@db:5432/inventario
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env.deploy}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      UPLOAD_DIR: /app/backend/uploads
      DETECTOR: yolo
      YOLO_MODEL_PATH: /app/backend/weights/best.pt
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.50}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PASSWORD_RESET_EXPIRE_MINUTES: "30"
      INVITACION_EXPIRE_HOURS: "72"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - uploads:/app/backend/uploads
      - type: bind
        source: ./backend/weights
        target: /app/backend/weights
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - web
      - database
    logging: *logging

  web:
    image: inventario-vision-web:deploy
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${WEB_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web
    logging: *logging

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
  